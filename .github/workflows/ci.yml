name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck, unit tests, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit & component tests
        working-directory: frontend
        run: npm test

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E tests (mock mode)
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend:
    name: Backend — unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Start Postgres (same image/port mapping as docker-compose)
        run: |
          sudo docker run -d --name kitchen-foods-db-test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=zoom119 \
            -e POSTGRES_DB=kitchen-foods-test \
            -p 5433:5432 \
            postgres:16-alpine
          # Wait until the server accepts connections.
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -p 5433 -U postgres && break
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5433 -U postgres

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Unit + integration tests
        working-directory: backend
        run: npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_USER: postgres
          DB_PASSWORD: zoom119
          DB_NAME: kitchen-foods-test
          JWT_SECRET: test-jwt-secret
